# sym link a dir to dotfiles from $HOME/.config/alacritty
[general] 
# Themes are vendored from https://github.com/alacritty/alacritty-theme —
# copy the file in rather than adding a submodule, so a clone is self-sufficient.
import = [
  "~/.config/alacritty/themes/everforest_dark.toml"
]

[window]
opacity = 0.95

blur = true

