# Colors (Everforest Dark Medium)
#
# Vendored from https://github.com/alacritty/alacritty-theme
# at commit 03cce642656759f440c97bb99ce65fc1c5b064a1 (themes/everforest_dark.toml).
# Previously a git submodule pointer with no .gitmodules entry, so a fresh
# clone got an empty directory and the import below silently failed. Copied
# in so `git clone` alone fully provisions the machine.

# Default colors
[colors.primary]
background = '#2d353b'
foreground = '#d3c6aa'

# Normal colors
[colors.normal]
black   = '#475258'
red     = '#e67e80'
green   = '#a7c080'
yellow  = '#dbbc7f'
blue    = '#7fbbb3'
magenta = '#d699b6'
cyan    = '#83c092'
white   = '#d3c6aa'

# Bright colors
[colors.bright]
black   = '#475258'
red     = '#e67e80'
green   = '#a7c080'
yellow  = '#dbbc7f'
blue    = '#7fbbb3'
magenta = '#d699b6'
cyan    = '#83c092'
white   = '#d3c6aa'
